# Git hooks, installed automatically by `pnpm install`. Docs: https://lefthook.dev/configuration/

pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: '*.{js,ts,svelte,css,json,md,yml,yaml,html}'
      run: pnpm exec prettier --check --ignore-unknown {staged_files}

    - name: lint
      glob: '*.{js,ts,svelte}'
      run: pnpm exec eslint --max-warnings=0 {staged_files}

commit-msg:
  jobs:
    - name: conventional-commit
      run: pnpm exec commitlint --edit {1}

pre-push:
  jobs:
    - name: verify
      run: pnpm verify
