# Local development database. Start with `pnpm db:start`, stop with `pnpm db:stop`.
# These credentials are for your machine only; production uses its own DATABASE_URL.
services:
  db:
    image: postgres:18
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: local
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U root -d local']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
