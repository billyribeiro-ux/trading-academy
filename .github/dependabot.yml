# npm packages are updated by hand each month: Dependabot does not support pnpm 12 yet.
# See docs/adr/0012-update-npm-dependencies-manually-on-a-schedule.md
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']
