name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Required by src/env.ts at build time. CI serves the build on localhost.
  SITE_URL: http://localhost:4173

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      # Reads the pinned pnpm version from devEngines.packageManager in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Component tests run in a real browser, so CI needs Chromium.
      - name: Install Chromium for tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify (check, lint, unit tests, build)
        run: pnpm verify
